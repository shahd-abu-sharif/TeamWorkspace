services:
  postgres:
    image: postgres:16-alpine
    container_name: tadreeby-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tadreeby
    ports:
      - "5432:5432"
    volumes:
      - tadreeby_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tadreeby"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tadreeby_postgres_data: